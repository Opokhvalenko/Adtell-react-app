name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan needs the commits between the base and this head
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # The new commits of this PR or push. Runs as the runner's user: as root, git in the
      # container refuses the checkout ("dubious ownership") and silently scans 0 commits.
      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then RANGE="HEAD"; else RANGE="$BASE_SHA..HEAD"; fi
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --log-opts="$RANGE"

      - name: Dependency audit (production deps, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check + Biome
        run: npm run check

      - name: Unit tests (Vitest)
        if: ${{ hashFiles('**/*.test.{ts,tsx,js,jsx}', '**/*.spec.{ts,tsx,js,jsx}') != '' }}
        run: npm run test:run
        env:
          CI: true

      # On pull requests too: a broken build must not reach main
      - name: Build
        run: npm run build